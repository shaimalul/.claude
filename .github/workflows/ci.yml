name: CI

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static suite (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

  eval:
    name: Skill and agent evals (report-only)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      # Secrets cannot appear in an `if:`; expose only whether one exists. Fork PRs never receive it.
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            evals:
              - 'skills/**'
              - 'agents/**'
              - 'evals/**'
              - 'package.json'

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ steps.changes.outputs.evals }}" != "true" ]; then
            echo "Evals skipped: no skill, agent, or eval files changed." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "Evals skipped: OPENROUTER_API_KEY is not available to this run." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore promptfoo cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('evals/**') }}
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Run evals
        if: steps.gate.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npm ci
          npm run eval -- --no-progress-bar --output evals/results.json

      - name: Upload eval results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json
          if-no-files-found: ignore
