name: Skill and Agent Evals

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'evals/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'evals/**'
      - 'package.json'
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set up promptfoo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/promptfoo
          key: ${{ runner.os }}-promptfoo-v1
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Run skill/agent evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run eval -- --no-progress-bar --output evals/results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json
