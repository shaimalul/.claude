# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Representative eval suite for Claude Code skills and agents

providers:
  - id: openrouter:anthropic/claude-haiku-4.5
    config:
      apiKeyEnvar: OPENROUTER_API_KEY
      temperature: 0
      max_tokens: 1024

prompts:
  - file://prompts/system-and-question.yaml

defaultTest:
  options:
    provider:
      id: openrouter:anthropic/claude-haiku-4.5
      config:
        apiKeyEnvar: OPENROUTER_API_KEY
        temperature: 0
        max_tokens: 1024

tests:
  - description: tdd skill enforces writing a failing test before implementation
    vars:
      system: file://../skills/tdd/SKILL.md
      question: >-
        I need to add a function that validates email addresses. Walk me
        through exactly how you'd start, step by step.
    assert:
      - type: icontains
        value: failing test
      - type: llm-rubric
        value: >-
          The response describes writing a failing test before any
          implementation code (red-green-refactor), not writing the
          implementation first.

  - description: review-base skill labels SSOT violations as [Blocker]
    vars:
      system: file://../skills/review-base/SKILL.md
      question: >-
        You're reviewing a PR and find a function that duplicates logic
        already defined elsewhere in the codebase (an SSOT violation). How
        do you report this finding, and what severity prefix do you use?
    assert:
      - type: icontains
        value: '[Blocker]'

  - description: grilling primitive asks the frontier in rounds and holds back dependent questions
    vars:
      system: file://../skills/grilling/SKILL.md
      question: >-
        You need to stress-test my plan before I start building. There are
        five open questions: (1) which database to use, (2) the table schema,
        which depends on the database choice, (3) whether we need auth,
        (4) which auth provider, which depends on whether we need auth, and
        (5) what the deployment target is. How do you proceed?
    assert:
      - type: llm-rubric
        value: >-
          The response asks the independent questions (database, whether auth
          is needed, deployment target) together in the first round, each with
          a recommended answer, and explicitly defers the dependent questions
          (schema, auth provider) to a later round until their prerequisite is
          answered. It does not ask all five at once, and it does not ask only
          one question.

  - description: wayfinder rules a build ticket out of scope and stops after one ticket
    vars:
      system: file://../skills/wayfinder/SKILL.md
      question: >-
        I'm working a wayfinder map and just resolved a grilling ticket: we
        chose Postgres. There's also an open ticket titled 'Build the Postgres
        schema migration'. What do you do with that ticket, and what do you do
        next in this session?
    assert:
      - type: llm-rubric
        value: >-
          The response treats the 'Build the Postgres schema migration' ticket
          as downstream build work that does not belong on the map (closing it
          or ruling it out of scope), and says the session STOPS after
          recording the resolved ticket rather than resolving another ticket.

  - description: find-bug redacts a pasted secret and builds the loop from an env var
    vars:
      system: file://../skills/find-bug/SKILL.md
      question: >-
        Our /api/orders endpoint returns 500 for some users. Here's the curl I
        use: curl -H 'Authorization: Bearer sk_live_9f8a7b6c5d'
        https://api.example.com/api/orders. What's your first step? Show me the
        exact command you'd run.
    assert:
      - type: not-icontains
        value: sk_live_9f8a7b6c5d
      - type: llm-rubric
        value: >-
          The command shown reads the token from an environment variable or
          shows it as <REDACTED>, never the literal key, and the response
          advises rotating the pasted live key.

  - description: backend-agent enforces three-layer architecture
    vars:
      system: file://../agents/backend-agent.md
      question: >-
        I want to add a new endpoint that fetches a user's order history.
        What layers should the code be split across?
    assert:
      - type: icontains
        value: repository
      - type: llm-rubric
        value: >-
          The response describes controller, service, and repository as
          separate layers, not a single file handling everything.

  - description: security-agent flags SQL injection as a security issue
    vars:
      system: file://../agents/security-agent.md
      question: >-
        Review this code: `db.query("SELECT * FROM users WHERE id = " +
        req.params.id)`. Any issues?
    assert:
      - type: icontains
        value: injection
      - type: llm-rubric
        value: >-
          The response identifies this as a SQL injection vulnerability and
          recommends parameterized queries or an ORM instead of string
          concatenation.

  - description: architect-agent documents significant decisions as ADRs
    vars:
      system: file://../agents/architect-agent.md
      question: >-
        We just decided to replace our REST API with GraphQL for the main
        service. Should this decision be written down anywhere?
    assert:
      - type: icontains
        value: ADR
